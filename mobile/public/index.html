<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>LifeOS</title>
    <meta name="theme-color" content="#3F7A5C" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Installation sur l'écran d'accueil de l'iPhone (Safari › Partager › Sur l'écran d'accueil) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="format-detection" content="telephone=no" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background-color: #F6F4EE; }
      #root { display: flex; height: 100%; flex: 1; }
      /* évite le zoom auto d'iOS dans les champs de saisie et le rebond de la page */
      input, textarea { font-size: 16px; }
      html { overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
    </style>
  </head>
  <body>
    <noscript>LifeOS a besoin de JavaScript pour fonctionner.</noscript>
    <div id="root"></div>
  </body>
</html>
